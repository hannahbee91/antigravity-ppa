name: Build and Push Source Package to Launchpad PPA

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  launchpad-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dput gpg curl python3-bs4

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Resolve Download URL and Prepare Workspace
        run: |
          # 1. Use the pre-installed Headless Chrome to fully render the client-side JavaScript 
          # and dump the final DOM into a file.
          google-chrome-stable --headless=new --dump-dom "https://antigravity.google/download" > rendered_page.html

          # 2. Parse the fully-rendered DOM
          DOWNLOAD_URL=$(python3 -c "
          import urllib.parse, sys, re
          from bs4 import BeautifulSoup

          url = None
          try:
              with open('rendered_page.html', 'r', encoding='utf-8') as f:
                  html = f.read()

              soup = BeautifulSoup(html, 'html.parser')

              # Strategy A: Check all <a> tags for direct hrefs pointing to the Linux x64 IDE
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  href_lower = href.lower()
                  
                  if 'linux-x64' in href_lower and 'ide' in href_lower and 'arm' not in href_lower:
                      url = urllib.parse.urljoin('https://antigravity.google/', href)
                      break

              # Strategy B: Find visual buttons labeled 'x64' under the 'Linux' & 'IDE' sections
              if not url:
                  for a in soup.find_all('a', href=True):
                      text = a.get_text(strip=True).lower()
                      if 'x64' in text and 'arm' not in text:
                          parents_text = ' '.join(p.get_text(strip=True).lower() for p in a.parents if p.name not in ['body', 'html', 'main'])
                          if 'linux' in parents_text and 'ide' in parents_text and 'cli' not in parents_text and 'sdk' not in parents_text:
                              url = urllib.parse.urljoin('https://antigravity.google/', a['href'])
                              break

              # Strategy C: Brute-force regex for hidden JS variables or state endpoints
              if not url:
                  matches = re.findall(r'https?://[^\s\"\'<>{}()\[\]]+\.tar\.gz', html, re.IGNORECASE)
                  for m in matches:
                      m_clean = m.replace(' ', '%20') # Encode literal spaces safely
                      m_lower = m_clean.lower()
                      if 'linux-x64' in m_lower and 'ide' in m_lower and 'arm' not in m_lower:
                          url = m_clean
                          break

              if url:
                  # Guarantee that any spaces or special chars in the filename are URL-encoded for curl
                  url = urllib.parse.quote(url, safe=':/%?&=')
                  print(url)
              
          except Exception as e:
              sys.stderr.write(f'Scraper error: {e}\n')
          ")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to isolate the Linux x64 Antigravity IDE download URL."
            echo "--- DEBUG START: DUMPING RENDERED HTML ---"
            cat rendered_page.html
            echo "--- DEBUG END ---"
            exit 1
          fi

          echo "Isolated Target URL: $DOWNLOAD_URL"

          VERSION=$(date +'%Y.%m.%d')
          TARGET_DIST="resolute" # Ubuntu 26.04 LTS codename

          # Generate Debian Changelog
          mkdir -p debian
          cat <<EOF > debian/changelog
          antigravity-ide (${VERSION}-0ubuntu1~ppa1) ${TARGET_DIST}; urgency=low

            * Automated release build fetched from antigravity.google/download.

           -- Hannah Brown <hannah@hannahis.gay>  $(date -R)
          EOF

          # Download and unpack target archive (-L explicitly follows any 302 API redirects)
          curl -sSL "$DOWNLOAD_URL" -o antigravity.tar.gz
          mkdir -p opt/antigravity-ide
          tar -xzf antigravity.tar.gz -C opt/antigravity-ide --strip-components=1

      - name: Build and Sign Source Package
        env:
          GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          # Create a secure wrapper script for GPG to handle the passphrase dynamically
          # This prevents argument-splitting issues inside dpkg-buildpackage
          cat << 'EOF' > sign-wrapper.sh
          #!/bin/bash
          if [ -n "$GPG_PASSPHRASE" ]; then
            gpg --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"
          else
            gpg "$@"
          fi
          EOF
          chmod +x sign-wrapper.sh

          # Run the build using the wrapper script for signing
          dpkg-buildpackage -S -sa -k"$GPG_KEY_ID" --sign-command="$(pwd)/sign-wrapper.sh"

      - name: Upload Package to Launchpad PPA
        env:
          LP_USER: ${{ secrets.LAUNCHPAD_USER }}
          LP_PPA: ${{ secrets.LAUNCHPAD_PPA }}
        run: |
          cat <<EOF > ~/.dput.cf
          [custom-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~${LP_USER}/${LP_PPA}/ubuntu/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

          dput -f custom-ppa ../antigravity-ide_*_source.changes
