name: Build and Push Source Package to Launchpad PPA

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  launchpad-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dput gpg curl python3-bs4

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Resolve Download URL and Prepare Workspace
        run: |
          # Fetch and parse the direct x64 Linux Antigravity IDE tarball link
          DOWNLOAD_URL=$(python3 -c "
          import urllib.request, re, html, sys

          url = None
          try:
              req = urllib.request.Request(
                  'https://antigravity.google/download', 
                  headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'}
              )
              with urllib.request.urlopen(req) as resp:
                  raw_content = resp.read().decode('utf-8', errors='ignore')

              # 1. Unescape JSON/JS escaped slashes and HTML entities
              content = raw_content.replace('\\/', '/')
              content = html.unescape(content)

              # 2. Extract all tarball URLs from the page source (including scripts and JSON)
              tarball_urls = re.findall(
                  r'https?://[^\s\"\'<>{}()\[\]]+?\.(?:tar\.gz|tgz)', 
                  content, 
                  re.IGNORECASE
              )

              # 3. Filter for Linux x64 IDE tarball while excluding ARM64, CLI, and SDK
              candidates = []
              for target in tarball_urls:
                  t_lower = target.lower()
                  is_linux_x64 = 'linux-x64' in t_lower or ('linux' in t_lower and 'x64' in t_lower)
                  is_excluded = any(x in t_lower for x in ['arm64', 'cli', 'sdk'])
                  
                  if is_linux_x64 and not is_excluded:
                      candidates.append(target)

              if candidates:
                  # Prioritize candidate URLs explicitly referencing 'ide' or 'antigravity'
                  ide_matches = [c for c in candidates if 'ide' in c.lower() or 'antigravity' in c.lower()]
                  url = ide_matches[0] if ide_matches else candidates[0]

          except Exception as err:
              sys.stderr.write(f'Scraper encountered error: {err}\n')

          print(url or '')
          ")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to isolate the Linux x64 Antigravity IDE download URL."
            exit 1
          fi

          echo "Isolated Linux x64 IDE URL: $DOWNLOAD_URL"

          VERSION=$(date +'%Y.%m.%d')
          TARGET_DIST="noble" # Target Ubuntu release codename

          # Generate Debian Changelog
          mkdir -p debian
          cat <<EOF > debian/changelog
          antigravity-ide (${VERSION}-0ubuntu1~ppa1) ${TARGET_DIST}; urgency=low

            * Automated release build fetched from antigravity.google/download.

           -- Hannah Brown <hannah@hannahis.gay>  $(date -R)
          EOF

          # Download and unpack target archive
          curl -sSL "$DOWNLOAD_URL" -o antigravity.tar.gz
          mkdir -p opt/antigravity-ide
          tar -xzf antigravity.tar.gz -C opt/antigravity-ide --strip-components=1

      - name: Build and Sign Source Package
        env:
          GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          PASSPHRASE_ARG=""
          if [ -n "$GPG_PASSPHRASE" ]; then
            PASSPHRASE_ARG="--pinentry-mode loopback --passphrase $GPG_PASSPHRASE"
          fi

          dpkg-buildpackage -S -sa -k"$GPG_KEY_ID" signcommand="gpg $PASSPHRASE_ARG"

      - name: Upload Package to Launchpad PPA
        env:
          LP_USER: ${{ secrets.LAUNCHPAD_USER }}
          LP_PPA: ${{ secrets.LAUNCHPAD_PPA }}
        run: |
          cat <<EOF > ~/.dput.cf
          [custom-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~${LP_USER}/${LP_PPA}/ubuntu/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

          dput -f custom-ppa ../antigravity-ide_*_source.changes
