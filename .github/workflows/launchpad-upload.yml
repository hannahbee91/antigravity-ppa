name: Build and Push Source Package to Launchpad PPA

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  launchpad-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dput gpg curl python3-bs4

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Resolve Download URL and Prepare Workspace
        run: |
          # Semantically parse the download page to locate the redirect endpoint
          DOWNLOAD_URL=$(python3 -c "
          import urllib.request, sys
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          def get_download_url():
              try:
                  # Fetch primary download page
                  req = urllib.request.Request('https://antigravity.google/download', headers={'User-Agent': 'Mozilla/5.0'})
                  html = urllib.request.urlopen(req).read().decode('utf-8', errors='ignore')
                  soup = BeautifulSoup(html, 'html.parser')

                  for a in soup.find_all('a', href=True):
                      text = a.get_text(strip=True).lower()
                      href = a['href'].lower()
                      
                      # Look for x64 links, avoiding ARM64
                      if 'x64' in text or 'x64' in href:
                          if 'arm' in text or 'arm' in href:
                              continue
                          
                          # Traverse parent containers to confirm we are in the Linux IDE section
                          depth = 0
                          for p in a.parents:
                              # Stop bubbling up before hitting global page wrappers
                              if depth > 5 or p.name in ['body', 'html', 'main', 'nav', 'header']:
                                  break
                                  
                              p_text = p.get_text(strip=True).lower()
                              if 'linux' in p_text and 'ide' in p_text:
                                  if 'cli' not in p_text and 'sdk' not in p_text:
                                      return urljoin('https://antigravity.google/', a['href'])
                              depth += 1

                  # Fallback: Check the /releases page explicitly
                  req2 = urllib.request.Request('https://antigravity.google/releases', headers={'User-Agent': 'Mozilla/5.0'})
                  html2 = urllib.request.urlopen(req2).read().decode('utf-8', errors='ignore')
                  soup2 = BeautifulSoup(html2, 'html.parser')
                  
                  for a in soup2.find_all('a', href=True):
                      text = a.get_text(strip=True).lower()
                      if 'linux' in text and 'x64' in text and 'arm' not in text:
                          depth = 0
                          for p in a.parents:
                              if depth > 5 or p.name in ['body', 'html', 'main']:
                                  break
                              if 'ide' in p.get_text(strip=True).lower():
                                  return urljoin('https://antigravity.google/', a['href'])
                              depth += 1

              except Exception as e:
                  sys.stderr.write(f'Scraper error: {e}\n')
              
              return ''

          print(get_download_url())
          ")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to isolate the Linux x64 Antigravity IDE download URL."
            exit 1
          fi

          echo "Isolated Target URL: $DOWNLOAD_URL"

          VERSION=$(date +'%Y.%m.%d')
          TARGET_DIST="noble" # Ubuntu 26.04 LTS codename

          # Generate Debian Changelog
          mkdir -p debian
          cat <<EOF > debian/changelog
          antigravity-ide (${VERSION}-0ubuntu1~ppa1) ${TARGET_DIST}; urgency=low

            * Automated release build fetched from antigravity.google/download.

           -- Hannah Brown <hannah@hannahis.gay>  $(date -R)
          EOF

          # Download and unpack target archive
          curl -sSL "$DOWNLOAD_URL" -o antigravity.tar.gz
          mkdir -p opt/antigravity-ide
          tar -xzf antigravity.tar.gz -C opt/antigravity-ide --strip-components=1

      - name: Build and Sign Source Package
        env:
          GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          PASSPHRASE_ARG=""
          if [ -n "$GPG_PASSPHRASE" ]; then
            PASSPHRASE_ARG="--pinentry-mode loopback --passphrase $GPG_PASSPHRASE"
          fi

          dpkg-buildpackage -S -sa -k"$GPG_KEY_ID" signcommand="gpg $PASSPHRASE_ARG"

      - name: Upload Package to Launchpad PPA
        env:
          LP_USER: ${{ secrets.LAUNCHPAD_USER }}
          LP_PPA: ${{ secrets.LAUNCHPAD_PPA }}
        run: |
          cat <<EOF > ~/.dput.cf
          [custom-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~${LP_USER}/${LP_PPA}/ubuntu/
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

          dput -f custom-ppa ../antigravity-ide_*_source.changes
